name: Build GitHub Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Read package version
        shell: bash
        run: node -p '"RELEASE_VERSION=" + require("./package.json").version' >> "$GITHUB_ENV"

      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $RELEASE_VERSION" >&2
            exit 1
          fi

          if git rev-parse "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Compile tests
        run: npm run test-compile

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: xvfb-run --auto-servernum node ./out/test/runTest.js

      - name: Package VSIX
        run: >-
          npx --yes @vscode/vsce package --no-dependencies
          --out "lego-spikeprime-mindstorms-vscode-$RELEASE_VERSION.vsix"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          prerelease_flag=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            prerelease_flag+=(--prerelease)
          fi

          tag="v$RELEASE_VERSION"
          asset="lego-spikeprime-mindstorms-vscode-$RELEASE_VERSION.vsix"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$asset"
          generated_notes=$(gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body)

          printf '%s\n\n' "$generated_notes" > release-notes.md
          cat >> release-notes.md <<'EOF'
          ## Install

          ### Windows (PowerShell)

          ```powershell
          EOF
          printf '$URL = "%s"\n' "$url" >> release-notes.md
          cat >> release-notes.md <<'EOF'
          Invoke-WebRequest -Uri "$URL" -OutFile "$(Split-Path -Leaf $URL)"; code --install-extension "$(Split-Path -Leaf $URL)" --force; Remove-Item "$(Split-Path -Leaf $URL)"
          ```

          ### Linux/macOS

          ```bash
          EOF
          printf 'URL="%s"\n' "$url" >> release-notes.md
          cat >> release-notes.md <<'EOF'
          curl --fail --location "$URL" --output "$(basename "$URL")"; code --install-extension "$(basename "$URL")" --force; rm "$(basename "$URL")"
          ```
          EOF

          gh release create "$tag" \
            "$asset" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file release-notes.md \
            "${prerelease_flag[@]}"
